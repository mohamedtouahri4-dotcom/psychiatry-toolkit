    <div class="back-row" onclick="goTo('home')"><span class="arrow">‹</span><span class="label" data-i18n="home">Accueil</span></div>
    <h2 data-i18n="somaCardTitle">Manifestations somatiques de l'anxiété</h2>
    <p class="hint" style="margin:6px 0 16px;" data-i18n="somaHint">Cochez ce qui est présent. Le verdict se met à jour automatiquement.</p>

    <div class="subtype-row" id="somaSubtypes">
      <div class="subtype selected" data-subtype="colon" data-i18n="soma_colon">Côlon irritable</div>
      <div class="subtype" data-subtype="palpitations" data-i18n="soma_palpitations">Palpitations</div>
      <div class="subtype" data-subtype="dermato" data-i18n="soma_dermato">Dermatose</div>
      <div class="subtype" data-subtype="anxiete" data-i18n="soma_anxiete">Anxiété générale</div>
      <div class="subtype" data-subtype="cephalees" data-i18n="soma_cephalees">Céphalées de tension</div>
      <div class="subtype" data-subtype="vertiges" data-i18n="soma_vertiges">Vertiges psychogènes</div>
      <div class="subtype" data-subtype="fatigue" data-i18n="soma_fatigue">Fatigue chronique</div>
    </div>

    <div class="section-title first" id="somaRedFlagTitle" data-i18n="somaRedFlagTitle">Drapeaux rouges — orientent vers l'organique</div>
    <div class="card" id="somaRedFlags"></div>

    <div class="section-title">En faveur du fonctionnel / psychogène</div>
    <div class="card" id="somaFunctional"></div>

    <div class="verdict v-unclear" id="somaVerdict">Cochez au moins un élément pour obtenir une orientation.</div>

    <button class="btn-secondary" onclick="goTo('summary')" style="margin-top:18px;">Voir dans le résumé</button>
  </div>

  <!-- PSYCHIATRIC EMERGENCIES WIZARD -->
  <div class="screen" id="screen-urgence">
    <div class="back-row" onclick="goTo('home')"><span class="arrow">‹</span><span class="label" data-i18n="home">Accueil</span></div>
    <div class="wizard-progress" id="wizardProgress">Étape 1/8</div>
    <div class="wizard-track"><div class="wizard-fill" id="wizardFill" style="width:12.5%"></div></div>
    <h2 id="wizardTitle"></h2>
    <div id="wizardBody"></div>
    <div class="wizard-nav">
      <button class="btn-secondary" id="wizardPrev" onclick="wizardMove(-1)">Précédent</button>
      <button class="btn-primary" id="wizardNext" onclick="wizardMove(1)">Suivant</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="screen" id="screen-summary">
    <div class="back-row" onclick="goTo('home')"><span class="arrow">‹</span><span class="label" data-i18n="home">Accueil</span></div>
    <h2 data-i18n="summaryScreenTitle">Résumé de séance</h2>
    <p class="hint" style="margin-bottom:14px;" data-i18n="summaryHint">Ce résumé compile les modules remplis. Relisez-le avant de l'intégrer au dossier officiel du patient — cet outil ne remplace pas le dossier médical.</p>
    <div class="card summary"><pre id="summaryText">Aucune donnée saisie pour l'instant.</pre></div>
    <button class="btn-secondary" onclick="resumeUrgence()" data-i18n="resumeBtn">◀ Revenir corriger le parcours Urgence</button>
    <button class="btn-primary" onclick="window.print()" data-i18n="printBtn">Imprimer / enregistrer en PDF</button>
    <button class="btn-secondary" onclick="exportJSON()" data-i18n="exportBtn">Exporter les données (.json)</button>
    <label class="first" style="margin-top:18px;" data-i18n="importLabel">Importer une séance sauvegardée</label>
    <input type="file" id="importFile" accept="application/json" onchange="importJSON(event)">
  </div>

</div>

<nav class="tabbar">

function t(key){ return (UI_STRINGS[currentLang] && UI_STRINGS[currentLang][key]) || UI_STRINGS.fr[key] || key; }

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(UI_STRINGS[currentLang] && UI_STRINGS[currentLang][key]!==undefined) el.textContent = UI_STRINGS[currentLang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    if(UI_STRINGS[currentLang] && UI_STRINGS[currentLang][key]!==undefined) el.setAttribute('placeholder', UI_STRINGS[currentLang][key]);
  });
  document.querySelectorAll('#langSwitch button').forEach(b=>{
    b.style.background = b.dataset.lang===currentLang ? 'var(--accent)' : 'transparent';
    b.style.color = b.dataset.lang===currentLang ? '#fff' : 'var(--ink)';
  });
}

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  applyStaticTranslations();
  // re-render whichever dynamic screen is currently active so wizard/summary text updates too
  const activeScreen = document.querySelector('.screen.active');
  if(activeScreen && activeScreen.id==='screen-urgence' && typeof renderWizardStep==='function') renderWizardStep();
  if(activeScreen && activeScreen.id==='screen-summary' && typeof renderSummary==='function') renderSummary();
  if(activeScreen && activeScreen.id==='screen-soma' && typeof renderSoma==='function'){
    document.getElementById('somaRedFlagTitle').textContent = currentSoma==='dermato' ? t('somaRedFlagTitleDermato') : t('somaRedFlagTitle');
    renderSoma();
  }
  if(activeScreen && activeScreen.id==='screen-risk') updateRiskBanner();
}

// ---- navigation ----
function goTo(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('nav .tab').forEach(t=>t.classList.toggle('active', t.dataset.screen===name));
  if(name==='summary') renderSummary();
  if(name==='urgence'){ wizardStepNum = 1; renderWizardStep(); }
  window.scrollTo(0,0);
}

// Reopen the Urgence wizard at whichever step it was left on (no data loss),
// used by the "revenir corriger" button on the Résumé screen.
function resumeUrgence(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-urgence').classList.add('active');
  document.querySelectorAll('nav .tab').forEach(t=>t.classList.toggle('active', t.dataset.screen==='urgence'));
  renderWizardStep();
  window.scrollTo(0,0);
}

// ---- choice chips (single-select rows only, identified by data-group) ----
document.querySelectorAll('.choice-row[data-group]').forEach(row=>{
  row.querySelectorAll('.choice').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      row.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected','risk-selected'));
      if(ch.dataset.risk==='true'){ ch.classList.add('risk-selected'); } else { ch.classList.add('selected'); }
      ch.dataset.active = "true";
      row.querySelectorAll('.choice').forEach(c=>{ if(c!==ch) c.dataset.active="false"; });
      updateRiskBanner();
    });
  });
});

// ---- static multi-select chip rows (risk protective factors, safety plan) ----
['riskProtectiveChips','spWarningChips','spCopingChips','spDistractionChips'].forEach(id=>{
  const row = document.getElementById(id);
  if(row){ row.querySelectorAll('.choice').forEach(ch=>{ ch.addEventListener('click', ()=>ch.classList.toggle('selected')); }); }
});

function updateRiskBanner(){
  const anyRisk = [...document.querySelectorAll('#screen-risk .choice')]
    .some(c => c.dataset.active==='true' && c.dataset.risk==='true');
  document.getElementById('riskBanner').classList.toggle('show', anyRisk);
}

function getChoice(group){
  const el = document.querySelector(`.choice-row[data-group="${group}"] .choice[data-active="true"]`);
  return el ? t('risk_'+group+'_'+el.dataset.value) : '—';
}

function val(id){ const el=document.getElementById(id); return el && el.value.trim() ? el.value.trim() : '—'; }

      puerperale:{label:"ذهان النفاس", actionRed:"فصل الأم عن الرضيع بسبب خطر إيذاء الطفل. تقييم التهابي كامل. التحقق من السوابق. تهدئة المريضة. التوجيه لاستشارة نفسية في أقرب وقت ممكن.", actionOrange:"استشارة نفسية سريعة (خلال 48 ساعة)."},
      psychoseaigue:{label:"ذهان حاد / نوبة ذهانية وجيزة", actionRed:"تأمين المريض — خطر اندفاع انتحاري مفاجئ. التوجيه للاستشفاء النفسي.", actionOrange:"استشارة نفسية سريعة."},
      maniaque:{label:"نوبة هوس", actionRed:"تهدئة عن طريق الحقن في حال النشاط الحركي المفرط أو رفض الطريق الفموي. الاستشفاء النفسي.", actionOrange:"التحقق من الالتزام الدوائي. إذا قُبل الطريق الفموي، التوجيه لاستشارة نفسية."},
      catatonie:{label:"الذهول الجامودي (الكاتاتونيا)", actionRed:"إيقاف كل علاج مضاد ذهاني. التحقق من الحالة التغذوية والإماهة. قياس إنزيم CPK. التوجيه إلى الطوارئ النفسية.", actionOrange:""},
      panique:{label:"نوبة هلع", actionRed:"لا تُستبعد الأسباب القلبية قبل إجراء تقييم قلبي (تخطيط القلب، تروبونين عند الشك).", actionOrange:"الإصغاء الجيد. تقنية التنفس البطيء (عبر ماصة). التوجيه لاستشارة خارجية بعد زوال النوبة."},
      stressaigu:{label:"رد فعل الإجهاد الحاد", actionRed:"تقييم نفسي عاجل.", actionOrange:"الطمأنة دون رفع الصوت. إبعاد مصدر التوتر. عدم إعطاء البنزوديازيبينات في هذه المرحلة. التوجيه لاستشارة خارجية."},
      alimentaire:{label:"رفض حاد للتغذية", actionRed:"تقييم مدة التطور والاضطرابات البيولوجية. التعويض الغذائي عند الحاجة. في حال الاستمرار رغم تحسن الفحوصات، التوجيه العاجل.", actionOrange:"إذا تحسنت الفحوصات وخفّت الأعراض، تكفي استشارة خارجية."},
      syndromemalin:{label:"المتلازمة الخبيثة للمضادات الذهانية", actionRed:"الإيقاف الفوري لكل علاج مضاد ذهاني. تقييم كامل يشمل وظائف الكلى وإنزيم CPK. التوجيه إلى الإنعاش.", actionOrange:""},
      serotoninergique:{label:"متلازمة السيروتونين", actionRed:"الإيقاف الفوري للعامل السيروتونيني المسبب — عدم إعادة إعطائه إطلاقاً. الإماهة، التبريد عند فرط الحرارة، البنزوديازيبينات عند الهياج. التوجيه إلى الإنعاش عند وجود علامات خطورة.", actionOrange:""},
      sevrage:{label:"متلازمة الانسحاب (كحول / بنزوديازيبينات)", actionRed:"إماهة مكثفة. علاج بالفيتامينات B1-B6-B12 (للوقاية من متلازمة غايي-فيرنيكه). البدء ببنزوديازيبين. التوجيه إلى مركز إدمان بعد الاستقرار.", actionOrange:"مراقبة لصيقة، تكفل مؤطر (بنزوديازيبينات وفق البروتوكول)."},
      intoxication:{label:"تسمم حاد (كحول / مخدرات)", actionRed:"الإماهة، تخطيط قلب منهجي. الاتصال بمركز مكافحة السموم. الاستشفاء في الإنعاش عند وجود علامات خطورة.", actionOrange:""},
      heteroagressivite:{label:"العدوانية تجاه الغير / العنف", actionRed:"تأمين سلامة المحيط. التهدئة. التوجيه إلى الطوارئ النفسية. النظر في شهادة الخطورة من أجل استشفاء إجباري عند الحاجة.", actionOrange:""},

  motifs: {
    fr: {
      suicidal:{label:"Idées suicidaires", def:"Pensées envahissantes centrées sur la mort ou le souhait de mourir, avec ou sans intention ni plan précis."},
      agitation:{label:"Agitation", def:"Instabilité psychomotrice avec activité motrice et/ou verbale excessive, pouvant mettre le patient ou l'entourage en danger."},
      confusion:{label:"Confusion", def:"Trouble aigu de la vigilance et de l'attention avec désorientation — d'origine organique jusqu'à preuve du contraire."},
      anxiety:{label:"Anxiété aiguë", def:"Sensation intense et soudaine d'appréhension, avec manifestations physiques (palpitations, oppression, tremblements)."},
      depressive:{label:"Symptômes dépressifs", def:"Tristesse persistante et/ou perte d'intérêt ou de plaisir, associées à des symptômes somatiques ou cognitifs."},
      behavior:{label:"Troubles du comportement", def:"Modification inhabituelle et significative du comportement habituel du patient, sans étiquette diagnostique présupposée."},
      somatic:{label:"Plainte somatique inexpliquée", def:"Symptôme physique rapporté par le patient sans cause organique identifiée à ce stade de l'évaluation."},
      mania:{label:"Excitation ou exaltation de l'humeur", def:"Élévation inhabituelle de l'humeur, accélération du débit de parole, réduction du besoin de sommeil ou désinhibition."},
      psychosis:{label:"Hallucinations ou idées délirantes", def:"Perceptions sans objet réel, ou convictions erronées auxquelles le patient adhère fermement."},
      foodrefusal:{label:"Refus de s'alimenter", def:"Refus volontaire ou involontaire de prendre des aliments et/ou des liquides sur une durée significative."},
      intox:{label:"Intoxication aiguë", def:"Prise récente d'alcool ou de substances avec retentissement clinique observable."},
      violence:{label:"Violence ou agressivité", def:"Comportement menaçant ou geste agressif envers autrui, mettant en danger l'entourage ou le soignant."}
    },
    en: {
      suicidal:{label:"Suicidal ideation", def:"Intrusive thoughts centered on death or the wish to die, with or without a specific intent or plan."},
      agitation:{label:"Agitation", def:"Psychomotor instability with excessive motor and/or verbal activity, potentially endangering the patient or those around them."},
      confusion:{label:"Confusion", def:"Acute disturbance of alertness and attention with disorientation — organic until proven otherwise."},
      anxiety:{label:"Acute anxiety", def:"Intense, sudden feeling of apprehension, with physical manifestations (palpitations, chest tightness, tremors)."},
      depressive:{label:"Depressive symptoms", def:"Persistent sadness and/or loss of interest or pleasure, with associated somatic or cognitive symptoms."},
      behavior:{label:"Behavioral disturbance", def:"Unusual and significant change in the patient's usual behavior, without presupposing a diagnostic label."},
      somatic:{label:"Unexplained somatic complaint", def:"Physical symptom reported by the patient with no organic cause identified at this stage of assessment."},
      mania:{label:"Elevated or excited mood", def:"Unusually elevated mood, rapid speech, reduced need for sleep, or disinhibition."},
      psychosis:{label:"Hallucinations or delusions", def:"Perceptions with no real object, or false convictions the patient firmly holds."},
      foodrefusal:{label:"Refusal to eat", def:"Voluntary or involuntary refusal of food and/or fluids over a significant period."},
      intox:{label:"Acute intoxication", def:"Recent use of alcohol or substances with observable clinical impact."},
      violence:{label:"Violence or aggression", def:"Threatening behavior or aggressive act toward others, endangering those nearby or staff."}
    },
    ar: {
      suicidal:{label:"أفكار انتحارية", def:"أفكار متسلطة تدور حول الموت أو الرغبة في الموت، مع وجود أو غياب نية أو خطة محددة."},
      agitation:{label:"الهياج", def:"عدم استقرار حركي نفسي مع نشاط حركي و/أو كلامي مفرط، قد يعرّض المريض أو المحيطين به للخطر."},
      confusion:{label:"التخليط الذهني", def:"اضطراب حاد في اليقظة والانتباه مع تشوش في التوجه — يُعتبر عضوي المنشأ حتى يثبت العكس."},
      anxiety:{label:"قلق حاد", def:"شعور مفاجئ وشديد بالترقب، مصحوب بمظاهر جسدية (خفقان، ضيق في الصدر، رعشة)."},
      depressive:{label:"أعراض اكتئابية", def:"حزن مستمر و/أو فقدان الاهتمام أو المتعة، مصحوب بأعراض جسدية أو معرفية."},
      behavior:{label:"اضطراب في السلوك", def:"تغيّر غير معتاد وملحوظ في سلوك المريض المعتاد، دون افتراض تشخيص مسبق."},
      somatic:{label:"شكوى جسدية غير مفسَّرة", def:"عرض جسدي يبلّغ عنه المريض دون تحديد سبب عضوي في هذه المرحلة من التقييم."},
      mania:{label:"ارتفاع أو نشوة في المزاج", def:"ارتفاع غير معتاد في المزاج، تسارع في الكلام، تراجع الحاجة إلى النوم، أو فقدان التحفظ."},
      psychosis:{label:"هلاوس أو أفكار وهامية", def:"إدراكات دون وجود موضوع حقيقي، أو قناعات خاطئة يتمسك بها المريض بشدة."},
      foodrefusal:{label:"رفض التغذية", def:"رفض إرادي أو لا إرادي لتناول الطعام و/أو السوائل لفترة معتبرة."},
      intox:{label:"تسمم حاد", def:"تعاطٍ حديث للكحول أو مواد مع تأثير سريري ملحوظ."},
      violence:{label:"عنف أو عدوانية", def:"سلوك تهديدي أو فعل عدواني تجاه الآخرين، يعرّض المحيط أو الطاقم الطبي للخطر."}
    }
  },

// L(dict, key [, subkey]) — translation lookup with French fallback
function L(dict, key, subkey){
  const bucket = (CLINICAL_I18N[dict] && (CLINICAL_I18N[dict][currentLang] || CLINICAL_I18N[dict].fr)) || {};
  const entry = bucket[key];
  if(entry===undefined) return key;
  if(subkey===undefined) return entry;
  return (entry[subkey]!==undefined) ? entry[subkey] : key;
}
function Lmisc(group, key){
  const bucket = (CLINICAL_I18N.misc[currentLang] || CLINICAL_I18N.misc.fr)[group] || {};
  return bucket[key]!==undefined ? bucket[key] : key;
}

function computeUrgenceMatch(checked){
  const scores = {};
  Object.keys(CLINICAL_I18N.urgence.fr).forEach(k=>{ scores[k] = {score:0, hasRed:false}; });
  checked.forEach(sign=>{
    const map = SIGN_WEIGHTS[sign];
    if(!map) return;
    Object.entries(map).forEach(([cond,w])=>{
      if(!scores[cond]) return;
      scores[cond].score += w;
      if(w===2) scores[cond].hasRed = true;
    });
  });
  const ranked = Object.entries(scores).filter(([,v])=>v.score>0).sort((a,b)=>b[1].score-a[1].score);
  return ranked;
}

};
const COLOR_LABEL = new Proxy({}, { get(_, prop){ return (COLOR_LABEL_I18N[currentLang]||COLOR_LABEL_I18N.fr)[prop]; } });

function worstColor(colors){
  return colors.reduce((worst,c)=> (COLOR_RANK[c]||0) > (COLOR_RANK[worst]||0) ? c : worst, colors[0]||'jaune');
}
function pickMotifRecommendation(chips){
  if(chips.length===0) return {color:'jaune', text: COLOR_LABEL['jaune']};
  const color = worstColor(chips.map(m=>MOTIF_COLOR[m]||'jaune'));
  const worstMotifs = chips.filter(m=>(MOTIF_COLOR[m]||'jaune')===color);
  const withOverride = worstMotifs.find(m=>CLINICAL_I18N.motifAction[currentLang] && CLINICAL_I18N.motifAction[currentLang][m]);
  return {color, text: withOverride ? CLINICAL_I18N.motifAction[currentLang][withOverride] : COLOR_LABEL[color]};
}

  } else if(wizardStepNum===5){

  }

function wizardMove(dir){
  saveWizardStepData();
  if(wizardStepNum===1 && dir===-1){ goTo('home'); return; }
  if(wizardStepNum===WIZARD_TOTAL && dir===1){ renderSummary(); goTo('summary'); return; }
  wizardStepNum = Math.min(WIZARD_TOTAL, Math.max(1, wizardStepNum+dir));
  renderWizardStep();
}


function updateUrgenceMatchUI(){
  const ranked = computeUrgenceMatch(urgenceSigns);
  const v = document.getElementById('urgenceVerdict');
  if(!v) return;
  v.className = 'verdict';
  if(ranked.length===0){
    v.classList.add('v-unclear');
    v.textContent = "Cochez au moins un signe pour obtenir une orientation.";
    window.lastUrgenceColor = 'jaune';
    return;
  }
  const topScore = ranked[0][1].score;
  const topMatches = ranked.filter(([,v2])=>v2.score===topScore);
  currentUrgence = topMatches[0][0];
  const anyRed = topMatches.some(([,v2])=>v2.hasRed);
  const color = anyRed ? 'rouge' : 'orange';
  window.lastUrgenceColor = color;
  const labels = topMatches.map(([k])=>L('urgence',k,'label')).join(' / ');
  const action = anyRed ? L('urgence',currentUrgence,'actionRed') : (L('urgence',currentUrgence,'actionOrange') || L('urgence',currentUrgence,'actionRed'));
  v.classList.add(anyRed ? 'v-organic' : 'v-orange');
  const diagWord = currentLang==='ar' ? 'التشخيص الأرجح' : (currentLang==='en' ? 'Most likely diagnosis' : 'Diagnostic le plus probable');
  v.textContent = `${anyRed?'🔴':'🟠'} ${diagWord} : ${labels}. ${action}`;
  window.lastUrgenceVerdict = v.textContent;
}

function SD(key, field){ return (SOMA_I18N[currentLang] || SOMA_I18N.fr)[key][field]; }

let currentSoma = 'colon';

function renderSoma(){
  const rf = document.getElementById('somaRedFlags');
  const fn = document.getElementById('somaFunctional');
  rf.innerHTML = SD(currentSoma,'redFlags').map((t,i)=>`
    <label class="check-item redflag"><input type="checkbox" data-kind="rf" data-idx="${i}" onchange="updateSomaVerdict()"><span>${t}</span></label>
  `).join('');
  fn.innerHTML = SD(currentSoma,'functional').map((t,i)=>`
    <label class="check-item"><input type="checkbox" data-kind="fn" data-idx="${i}" onchange="updateSomaVerdict()"><span>${t}</span></label>
  `).join('');
  updateSomaVerdict();
}

function updateSomaVerdict(){
  const referral = SD(currentSoma,'referral');
  const rfChecked = document.querySelectorAll('#somaRedFlags input:checked').length;
  const fnChecked = document.querySelectorAll('#somaFunctional input:checked').length;
  const v = document.getElementById('somaVerdict');
  v.className = 'verdict';
  const wordsFlag = currentLang==='ar' ? {n:'علامة/علامات تحذيرية', msg1:(n)=>`تم تحديد ${n} علامة/علامات تحذيرية — يجب إجراء تقييم عضوي أولاً قبل أي توجه نفسي المنشأ. ${referral}`, msg2:(n)=>`لا توجد علامات تحذيرية، ${n} معيار/معايير وظيفية متوفرة. التوجه الوظيفي/النفسي المنشأ محتمل. ${referral}`, msg3:"العناصر غير كافية للاستنتاج. متابعة التقييم قبل التوجيه."}
    : (currentLang==='en' ? {msg1:(n)=>`${n} red flag(s) checked — organic work-up takes priority before any psychogenic orientation. ${referral}`, msg2:(n)=>`No red flags, ${n} functional criterion/criteria present. A functional/psychogenic orientation is plausible. ${referral}`, msg3:"Not enough elements to conclude. Continue the assessment before referral."}
    : {msg1:(n)=>`${n} drapeau(x) rouge(s) coché(s) — bilan organique prioritaire avant toute orientation psychogène. ${referral}`, msg2:(n)=>`Aucun drapeau rouge, ${n} critère(s) fonctionnel(s) présents. Orientation fonctionnelle/psychogène plausible. ${referral}`, msg3:"Éléments insuffisants pour conclure. Poursuivre l'évaluation avant orientation."});
  if(rfChecked > 0){
    v.classList.add('v-organic');
    v.textContent = wordsFlag.msg1(rfChecked);
  } else if(fnChecked >= 2){
    v.classList.add('v-functional');
    v.textContent = wordsFlag.msg2(fnChecked);
  } else {
    v.classList.add('v-unclear');
    v.textContent = wordsFlag.msg3;
  }
}

document.querySelectorAll('#somaSubtypes .subtype').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('#somaSubtypes .subtype').forEach(s=>s.classList.remove('selected'));
    el.classList.add('selected');
    currentSoma = el.dataset.subtype;
    document.getElementById('somaRedFlagTitle').textContent =
      currentSoma==='dermato' ? t('somaRedFlagTitleDermato') : t('somaRedFlagTitle');
    renderSoma();
  });
});
renderSoma();

// ---- export / import (no local storage — data stays in-memory only) ----
function collectData(){
  const data = {ref: val('patientRef'), fields:{}, choices:{}};
  document.querySelectorAll('textarea, input[type=text]').forEach(el=>{ if(el.id) data.fields[el.id]=el.value; });
  document.querySelectorAll('.choice-row').forEach(row=>{
    const active = row.querySelector('.choice[data-active="true"]');
    data.choices[row.dataset.group] = active ? active.dataset.value : null;
  });
  return data;
}

function exportJSON(){
  const data = collectData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (data.ref!=='—' && data.ref ? data.ref : 'seance') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
